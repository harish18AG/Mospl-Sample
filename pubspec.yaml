name: mospl
description: MOSPL - Premium Leather Products by onlinemadras.com
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0

  # Navigation
  go_router: ^17.2.3

  # UI & Design
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.3.3
  smooth_page_indicator: ^2.0.1
  carousel_slider: ^5.1.2
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  fl_chart: ^1.2.0
  percent_indicator: ^4.2.3

  # Authentication
  google_sign_in: ^7.2.0
  local_auth: ^3.0.1
  pin_code_fields: ^9.3.0

  # Storage & Preferences
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  http: ^1.1.0
  dio: ^5.4.0
  connectivity_plus: ^7.1.1

  # Media
  image_picker: ^1.0.7
  video_player: ^2.8.2
  photo_view: ^0.15.0
  flutter_image_compress: ^2.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  get_it: ^9.2.1
  injectable: ^2.3.2

  # Voice & Search
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5

  # Maps & Location
  geolocator: ^14.0.2
  google_maps_flutter: ^2.5.3

  # Payment
  razorpay_flutter: ^1.3.6

  # PDF & Share
  pdf: ^3.10.7
  printing: ^5.12.0
  share_plus: ^12.0.2
  path_provider: ^2.1.2

  # Animation
  animate_do: ^5.1.0
  flutter_staggered_animations: ^1.1.1
  animations: ^2.0.11

  # Notifications
  flutter_local_notifications: ^21.0.0

  # Barcode/QR
  qr_flutter: ^4.1.0

  # Charts
  syncfusion_flutter_charts: ^33.2.5

  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700