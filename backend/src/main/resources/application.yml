spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mospl
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

security:
  jwt:
    secret: super-secret-key-change-in-env
    expiry-ms: 86400000

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4.1-mini
